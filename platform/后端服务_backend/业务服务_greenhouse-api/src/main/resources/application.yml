server:
  port: ${API_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: greenhouse-api
  task:
    scheduling:
      # 多个定时任务（遥测注入、指令超时、链上补偿）互不阻塞
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
  servlet:
    multipart:
      # 检测报告等附件上传上限；前端提示与这里保持一致
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:20MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:25MB}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/smart_greenhouse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  security:
    user:
      name: ${APP_ADMIN_USER:admin}
      password: ${APP_ADMIN_PASSWORD:123}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  cors:
    # 前端可能通过 localhost、127.0.0.1 或固定公网域名打开，任何一个没列进来，
    # 登录 POST 带上的 Origin 都会被判成非法跨域（403 Invalid CORS request）。
    # 公网域名是 ngrok 账号绑定的固定 dev domain，长期有效。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5199,http://127.0.0.1:5199,http://localhost:5173,http://127.0.0.1:5173,https://sage-ship-scribing.ngrok-free.dev}
  security:
    jwt-secret: ${APP_JWT_SECRET:change-this-jwt-secret-for-demo-2026-smart-greenhouse}
    jwt-expires-minutes: ${APP_JWT_EXPIRES_MINUTES:120}
  iot:
    service-username: ${IOT_API_USERNAME:iot-service}
    service-password: ${IOT_API_PASSWORD:123}
  cache:
    # 需要 Redis 缓存聚合查询时设为 true；默认关闭，未启动 Redis 的演示环境不受影响
    enabled: ${CACHE_ENABLED:false}
    key-prefix: ${CACHE_KEY_PREFIX:greenhouse:}
    overview-ttl-seconds: ${CACHE_OVERVIEW_TTL_SECONDS:10}
    dashboard-ttl-seconds: ${CACHE_DASHBOARD_TTL_SECONDS:30}
  external:
    # 外部平台适配器：mock=本地模拟（默认，演示无需外网）；rest=调用真实 HTTP 接口
    timeout-ms: ${EXTERNAL_TIMEOUT_MS:3000}
    sync-batch-size: ${EXTERNAL_SYNC_BATCH_SIZE:10}
    retry:
      max-attempts: ${EXTERNAL_RETRY_MAX_ATTEMPTS:2}
    weather:
      mode: ${EXTERNAL_WEATHER_MODE:mock}
      base-url: ${EXTERNAL_WEATHER_BASE_URL:}
      token: ${EXTERNAL_WEATHER_TOKEN:}
      sync-enabled: ${EXTERNAL_WEATHER_SYNC_ENABLED:true}
      sync-interval-ms: ${EXTERNAL_WEATHER_SYNC_INTERVAL_MS:600000}
      sync-initial-delay-ms: ${EXTERNAL_WEATHER_SYNC_INITIAL_DELAY_MS:45000}
    sms:
      mode: ${EXTERNAL_SMS_MODE:mock}
      base-url: ${EXTERNAL_SMS_BASE_URL:}
      token: ${EXTERNAL_SMS_TOKEN:}
      alert-phone: ${EXTERNAL_SMS_ALERT_PHONE:13800000000}
    marketplace:
      mode: ${EXTERNAL_MARKETPLACE_MODE:mock}
      base-url: ${EXTERNAL_MARKETPLACE_BASE_URL:}
      token: ${EXTERNAL_MARKETPLACE_TOKEN:}
  control:
    # 指令超时扫描：设备不回执时先重试，超过重试上限置为失败
    timeout-scan:
      enabled: ${CONTROL_TIMEOUT_SCAN_ENABLED:true}
      interval-ms: ${CONTROL_TIMEOUT_SCAN_INTERVAL_MS:10000}
      initial-delay-ms: ${CONTROL_TIMEOUT_SCAN_INITIAL_DELAY_MS:15000}
      max-retries: ${CONTROL_TIMEOUT_SCAN_MAX_RETRIES:1}
      batch-size: ${CONTROL_TIMEOUT_SCAN_BATCH_SIZE:50}
  chain:
    # simulated=本地模拟回执；rest=调用链上适配服务，把交易真正写入 FISCO BCOS
    mode: ${CHAIN_MODE:rest}
    # auto 仅用于演示内存库：每次启动生成独立业务键前缀，避免复用持久链历史；
    # 使用 MySQL 等持久化数据库时保持 none，链上业务键与数据库主键一一对应。
    namespace-mode: ${CHAIN_NAMESPACE_MODE:none}
    namespace: ${CHAIN_NAMESPACE:}
    block-base: ${CHAIN_BLOCK_BASE:1284600}
    endpoint: ${FISCO_ENDPOINT:http://192.168.88.141:8600}
    adapter-path: ${FISCO_ADAPTER_PATH:/chain/adapter}
    # 只读区块查询：适配服务提供 GET /chain/block 时才有真实区块高度
    block-path: ${FISCO_BLOCK_PATH:/chain/block}
    timeout-ms: ${FISCO_TIMEOUT_MS:15000}
    group-id: ${FISCO_GROUP_ID:1}
    compensation:
      # 定时把链上失败、保留为 PENDING 的存证重新提交；无待补偿记录时不产生链上调用
      enabled: ${CHAIN_COMPENSATION_ENABLED:true}
      interval-ms: ${CHAIN_COMPENSATION_INTERVAL_MS:60000}
      initial-delay-ms: ${CHAIN_COMPENSATION_INITIAL_DELAY_MS:30000}
      batch-size: ${CHAIN_COMPENSATION_BATCH_SIZE:20}
  storage:
    provider: ${FILE_STORAGE_PROVIDER:local}
    local-root: ${FILE_STORAGE_LOCAL_ROOT:./data/files}
    minio-endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}
    minio-bucket: ${MINIO_BUCKET:smart-greenhouse}
  trace:
    # 一物一码二维码：码里只放一个可公开的校验地址，不放追溯明细。
    # 部署时把 public-base-url 换成实际域名，消费者扫码后打开前端溯源页，
    # 再由前端调用后端，结合 FISCO BCOS 根哈希、合格证与追溯节点做校验。
    qr:
      # 默认指向本机前端，保证演示开箱可扫码；
      # 正式部署必须用 TRACE_PUBLIC_BASE_URL 覆盖成真实域名（或电脑局域网地址）。
      public-base-url: ${TRACE_PUBLIC_BASE_URL:http://localhost:5199}
      # query = https://域名/traceability?code=产品编码
      # gs1   = https://域名/01/{GTIN}/21/{序列号}（需配置真实 GS1 厂商识别码）
      mode: ${TRACE_QR_MODE:query}
      # 指向消费者公开落地页（前端 /trace 路由），扫码后由该页调用公开接口核验
      query-path: ${TRACE_QR_QUERY_PATH:/trace}
      gs1-company-prefix: ${TRACE_GS1_COMPANY_PREFIX:}
      size: ${TRACE_QR_SIZE:320}
  ai:
    # AI 总结 / AI 问答走 OpenAI 兼容协议：换成 Kimi、通义千问只需改 base-url 与 model
    provider: ${AI_PROVIDER:DeepSeek}
    model-label: ${DEEPSEEK_MODEL:deepseek-chat}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    chat-path: ${DEEPSEEK_CHAT_PATH:/chat/completions}
    # 真实密钥用环境变量 DEEPSEEK_API_KEY 注入；
    # 这个占位值保证"没配密钥也能正常启动"，服务识别到占位值会直接给本地框架结论并说明原因
    api-key: ${DEEPSEEK_API_KEY:sk-not-configured}
    temperature: ${DEEPSEEK_TEMPERATURE:0.5}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:1600}
    # 同步调用超时：大模型生成较慢，读取超时给足 60 秒
    connect-timeout-ms: ${DEEPSEEK_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${DEEPSEEK_READ_TIMEOUT_MS:60000}
    # 单次问答最多带上多少条历史消息（user + assistant 合计）
    chat-history-limit: ${AI_CHAT_HISTORY_LIMIT:12}
    # 一次提问的字符上限，防止前端把整页数据塞进来
    max-question-length: ${AI_MAX_QUESTION_LENGTH:500}
